<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🕷️ Spidey-AI</title>

<link rel="icon" type="image/jpeg" href="favicon.jpg">

<meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header class="top-bar">

<div class="logo">
🕷️ Spidey-AI
</div>

<div class="top-buttons">

<button onclick="toggleTheme()">
🌙
</button>

<button onclick="openSettings()">
⚙️
</button>

</div>

</header>




<div class="ai-status">

<span>🟢</span>
Spidey-AI Online

</div>






<div id="chat-box">


<div class="message ai">

Hello 👋

I am Spidey-AI.

Your intelligent assistant.

Ask questions, search information, use voice or create images.

</div>


</div>







<div class="quick-tools">


<button onclick="startVoice()">
🎤
<br>
Voice
</button>


<button onclick="createImage()">
🖼️
<br>
Image
</button>


<button onclick="searchWeb()">
🔍
<br>
Search
</button>


<button onclick="uploadFile()">
📎
<br>
Files
</button>


</div>








<div class="input-box">


<input 
id="user-input"
type="text"
placeholder="Ask Spidey-AI anything..."
autocomplete="off"
>


<button onclick="sendMessage()">
➤
</button>


</div>







<div class="footer">

Powered by 🕷️ Spidey-AI

</div>



</div>





<input 
type="file"
id="file-upload"
hidden
>




<script src="script.js"></script>


</body>

</html>

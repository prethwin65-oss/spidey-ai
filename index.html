<!DOCTYPE html>
<html>
<head>

<title>Spidey-AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>

<h1>🕷️ Spidey-AI</h1>

<button onclick="toggleTheme()">🌙</button>

</header>



<div class="status">

🟢 Spidey-AI Online

</div>




<div id="chat-box">


<div class="message ai">

Hello 👋  
I am Spidey-AI.  
Ask anything, use voice, upload files or create images.

</div>


</div>





<div class="features">


<button onclick="startVoice()">
🎤 Voice
</button>


<button onclick="createImage()">
🖼️ Create Image
</button>


<button onclick="uploadFile()">
📎 File
</button>


<button onclick="searchWeb()">
🔍 Search
</button>


</div>






<div class="input-area">


<input 
id="user-input"
type="text"
placeholder="Message Spidey-AI..."
>



<button onclick="sendMessage()">

➤

</button>


</div>



<input 
type="file"
id="file-upload"
hidden
>




</div>



<script src="script.js"></script>


</body>

</html>
